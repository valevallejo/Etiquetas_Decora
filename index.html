<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etiquetas Decora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">

</head>
<body>
<style>
:root{
  --bg:#E8E9E6; --panel:#FFF; --panel-2:#F3F4F1; --ink:#1A1D1A; --muted:#697068;
  --line:#D5D8D3; --line-soft:#E5E8E3; --accent:#137A66; --accent-ink:#FFF;
  --alert:#E53628; --ok:#137A66; --warn:#9A6410;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141613; --panel:#1D201C; --panel-2:#252822; --ink:#E8EBE6; --muted:#98A096;
  --line:#31362F; --line-soft:#282D26; --accent:#4FB9A8; --accent-ink:#0A1A16;
  --alert:#FF6A5C; --ok:#4FB9A8; --warn:#D9A03F;
}}
:root[data-theme="dark"]{
  --bg:#141613; --panel:#1D201C; --panel-2:#252822; --ink:#E8EBE6; --muted:#98A096;
  --line:#31362F; --line-soft:#282D26; --accent:#4FB9A8; --accent-ink:#0A1A16;
  --alert:#FF6A5C; --ok:#4FB9A8; --warn:#D9A03F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

.app{display:flex;flex-direction:column;height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none}
.mark{width:26px;height:26px;border-radius:5px;background:var(--accent);flex:none;position:relative}
.mark::after{content:"";position:absolute;left:6px;top:11px;width:14px;height:4px;background:var(--accent-ink);border-radius:1px}
.tt h1{font-size:15px;margin:0;font-weight:700;letter-spacing:-.01em}
.tt span{font-size:11.5px;color:var(--muted)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:6px;padding:7px 12px;
  cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--panel);border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.sm{padding:4px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.main{flex:1;display:flex;min-height:0}
.panel{width:370px;flex:none;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
.stage{flex:1;display:flex;flex-direction:column;min-width:0}

.sect{border-bottom:1px solid var(--line-soft)}
.sect>summary{list-style:none;cursor:pointer;padding:13px 18px;display:flex;align-items:center;gap:10px;
  font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary::before{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);
  border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);flex:none;margin-top:-2px;transition:transform .15s}
.sect[open]>summary::before{transform:rotate(45deg);margin-top:-4px}
.sect>summary .step{font:500 10.5px/1 "IBM Plex Mono",monospace;color:var(--accent);
  border:1px solid var(--accent);border-radius:3px;padding:3px 4px;letter-spacing:0}
.sect>summary .hint{margin-left:auto;font:400 11px/1 "IBM Plex Mono",monospace;color:var(--muted);text-transform:none;letter-spacing:0}
.sbody{padding:2px 18px 18px;display:flex;flex-direction:column;gap:13px}
.field{display:flex;flex-direction:column;gap:5px}
.field>label{font-size:11.5px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select,input[type=text],input[type=number],input[type=search],textarea{width:100%;background:var(--panel-2);
  border:1px solid var(--line);border-radius:5px;padding:7px 8px;font-size:13px}
input[type=number]{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:72px;font-family:"IBM Plex Mono",monospace;font-size:12px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px}
.note{font-size:11.5px;color:var(--muted);line-height:1.5}
.note strong{color:var(--ink)}
.status{display:flex;gap:8px;font-size:12px;padding:8px 10px;border-radius:5px;background:var(--panel-2);
  border:1px solid var(--line-soft);line-height:1.4;align-items:flex-start}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.err{color:var(--alert)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;margin-top:5px}

.res{display:flex;flex-direction:column;gap:6px;max-height:270px;overflow-y:auto}
.rescard{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:6px;
  padding:7px 9px;background:var(--panel-2);text-align:left;cursor:pointer;width:100%}
.rescard:hover{border-color:var(--accent)}
.rescard img{width:34px;height:34px;object-fit:contain;background:#fff;border-radius:4px;flex:none}
.rescard .rc{min-width:0;flex:1}
.rescard b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rescard small{font:400 11px/1.3 "IBM Plex Mono",monospace;color:var(--muted)}

.queue{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.qrow{display:grid;grid-template-columns:1fr 78px 46px 26px;gap:7px;align-items:center;
  border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--panel-2)}
.qrow b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.qrow small{font:400 10.5px/1.2 "IBM Plex Mono",monospace;color:var(--muted)}
.qrow select,.qrow input{padding:4px 5px;font-size:11.5px}
.iconbtn{border:none;background:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:2px}
.iconbtn:hover{color:var(--alert)}

.stagebar{display:flex;align-items:center;gap:14px;padding:9px 18px;background:var(--panel);
  border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.metric{display:flex;align-items:baseline;gap:6px}
.metric b{font:600 16px/1 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.metric span{font-size:11.5px;color:var(--muted)}
.sep{width:1px;height:22px;background:var(--line)}
.zoom{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.zoom input{width:104px;accent-color:var(--accent)}
.canvas{flex:1;overflow:auto;padding:26px;display:flex;flex-direction:column;align-items:center;gap:26px}
.sheetwrap{position:relative;flex:none;filter:drop-shadow(0 6px 20px rgba(10,20,16,.18))}
.sheetlabel{position:absolute;top:-19px;left:0;font:500 11px/1 "IBM Plex Mono",monospace;color:var(--muted)}
.sheet{background:#fff;position:relative;transform-origin:top left;overflow:hidden}
.slot{position:absolute;overflow:hidden}
.slot.outline{outline:.25mm dashed #C4C9C2;outline-offset:-.25mm}
.empty{text-align:center;color:var(--muted);max-width:400px;margin:70px auto;font-size:13.5px;line-height:1.6}
.empty h2{font-size:16px;color:var(--ink);margin:0 0 6px}

/* ============ ETIQUETAS · medidas tomadas del archivo original ============ */
.lbl{width:85mm;height:125mm;position:relative;background:#fff;overflow:hidden;
  font-family:"Figtree","Poppins",system-ui,sans-serif;color:#616E5F}
.lbl .inner{position:absolute;left:0;top:0;transform-origin:top left}
.lbl .bg{position:absolute}
.lbl .t{position:absolute;line-height:1;white-space:nowrap;font-weight:400}
.lbl .wrap{white-space:normal;line-height:1.08;overflow:hidden}
.lbl .fit1{white-space:nowrap;overflow:hidden;line-height:1.12}
.lbl .fit1.multi{white-space:normal}
.lbl .fitw{overflow:hidden}
.lbl img.asset{position:absolute;display:block}
.lbl img.foto{position:absolute;object-fit:contain;object-position:center}
.lbl .nofoto{position:absolute;border:.3mm dashed #C9CFC6;border-radius:1mm;display:flex;
  align-items:center;justify-content:center;color:#AEB6AC;font-size:7pt}

@media print{
  .topbar,.panel,.stagebar,.toast,.sheetlabel{display:none!important}
  body{background:#fff}
  .app,.main,.stage{display:block;height:auto}
  .canvas{padding:0;gap:0;display:block;overflow:visible}
  .sheetwrap{filter:none;width:auto!important;height:auto!important;break-after:page}
  .sheetwrap:last-child{break-after:auto}
  .sheet{transform:none!important}
  .slot.outline{outline:none}
}
@page{size:215.9mm 279.4mm;margin:0}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--ink);
  color:var(--panel);padding:10px 16px;border-radius:7px;font-size:13px;opacity:0;pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:50;max-width:min(560px,90vw)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:900px){.main{flex-direction:column}.panel{width:100%;max-height:52vh;border-right:none;border-bottom:1px solid var(--line)}}
</style>

<div class="app">
  <header class="topbar">
    <div class="mark"></div>
    <div class="tt"><h1>Etiquetas Decora</h1><span>Portafolio en vivo &rarr; etiquetas de 85 × 125 mm</span></div>
    <div class="spacer"></div>
    <button class="btn" id="btnTheme">Tema</button>
    <button class="btn" id="btnClear">Vaciar cola</button>
    <button class="btn primary" id="btnPrint">Imprimir / Guardar PDF</button>
  </header>

  <div class="main">
    <aside class="panel">

      <details class="sect" open>
        <summary><span class="step">01</span>Buscar producto <span class="hint" id="srcHint">cargando…</span></summary>
        <div class="sbody">
          <div class="field"><label for="q">SKU o nombre</label>
            <input type="search" id="q" placeholder="7031797  ·  alfombra santorini" autocomplete="off"></div>
          <div class="res" id="res"></div>
        </div>
      </details>

      <details class="sect">
        <summary><span class="step">02</span>Carga masiva</summary>
        <div class="sbody">
          <div class="field"><label for="bulk">Pega una lista de SKUs, uno por línea (opcional « SKU, cantidad »)</label>
            <textarea id="bulk" placeholder="7031797, 4&#10;7002336, 1"></textarea></div>
          <button class="btn" id="btnBulk">Agregar a la cola</button>
        </div>
      </details>

      <details class="sect" open>
        <summary><span class="step">03</span>Cola de impresión <span class="hint" id="qHint">0</span></summary>
        <div class="sbody"><div class="queue" id="queue"></div></div>
      </details>

    </aside>

    <section class="stage">
      <div class="stagebar">
        <div class="metric"><b id="mLab">0</b><span>etiquetas</span></div>
        <div class="sep"></div>
        <div class="metric"><b id="mSheets">0</b><span>hojas</span></div>
        <div class="sep"></div>
        <div class="zoom"><label for="startAt">Empezar en</label>
          <input type="number" id="startAt" min="1" max="4" value="1" style="width:52px">
          <span>de 4</span></div>
        <div class="spacer"></div>
        <button class="btn sm" id="btnReload" title="Vuelve a leer el portafolio">Actualizar portafolio</button>
        <div class="sep"></div>
        <div class="zoom"><label for="zoom">Vista</label><input type="range" id="zoom" min="25" max="120" value="55"><span id="zv" style="font-family:'IBM Plex Mono',monospace">55%</span></div>
      </div>
      <div class="canvas" id="canvas"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function nnum(v){ const s=String(v??"").replace(/[^\d,.-]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"").replace(",",".");

/* ===================== lectura del portafolio ===================== */
function parseCsv(text){
  const rows=[]; let row=[], cell="", q=false;
  const t=text.replace(/\r\n?/g,"\n");
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(cell.trim()); cell=""; }
    else if(c==="\n"){ row.push(cell.trim()); rows.push(row); row=[]; cell=""; }
    else cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell.trim()); rows.push(row); }
  return rows.filter(r=>r.some(c=>c!==""));
}
async function fetchTab(param){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&${param}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error(`El portafolio respondió ${res.status}.`);
  const txt = await res.text();
  if(/^\s*</.test(txt)) throw new Error("La hoja no está compartida con enlace público.");
  return parseCsv(txt);
}
function findCols(headers){
  const H = headers.map(NORM), idx={};
  for(const [k,cands] of Object.entries(COLMAP)){
    let i = H.findIndex(h=>cands.includes(h));
    if(i<0) i = H.findIndex(h=>cands.some(c=>h.includes(c)));
    if(i>=0) idx[k]=i;
  }
  return idx;
}
/* El portafolio viene en mayúsculas; la etiqueta va en caja alta y baja.
   Se respetan los códigos y las medidas (los que llevan números) y las siglas cortas. */
const STOP = new Set(["de","del","la","las","el","los","y","e","o","u","con","en","por","para","a","al","sin","x"]);
function bonito(s){
  return String(s||"").trim().split(/\s+/).map((w,i)=>{
    if(/\d/.test(w)) return w.toUpperCase();               // medidas y códigos
    const low = w.toLowerCase();
    if(i>0 && STOP.has(low)) return low;                   // conectores
    if(w.length<=3 && w===w.toUpperCase()) return w;       // siglas: MJ, LED
    return w.charAt(0).toUpperCase()+low.slice(1);
  }).join(" ");
}
async function cargarPortafolio(silencioso){
  const hint=$("srcHint");
  hint.textContent = "cargando…";
  try{
    const rows = await fetchTab(`gid=${GID_PORTAFOLIO}`);
    if(rows.length<2) throw new Error("El portafolio llegó vacío.");
    S.headers = rows[0];
    S.idx = findCols(S.headers);
    const faltan = ["sku","nombre","estado","oferta","lista"].filter(k=>S.idx[k]===undefined);
    if(faltan.length) throw new Error("Faltan columnas en el portafolio: "+faltan.join(", "));
    S.rows = rows.slice(1).filter(r=>String(r[S.idx.sku]||"").trim());
    S.listo = true;
    hint.textContent = `${S.rows.length} productos`;
    try{
      const fr = await fetchTab(`sheet=${encodeURIComponent(TAB_FOTOS)}`);
      const fh = fr[0].map(NORM);
      const iS = fh.findIndex(h=>h.includes("sku")||h.includes("codigo"));
      const iF = fh.findIndex(h=>h.includes("foto")||h.includes("imagen")||h.includes("url"));
      S.fotos = {};
      if(iS>=0&&iF>=0) for(const r of fr.slice(1)) if(r[iS]) S.fotos[String(r[iS]).trim()]=r[iF];
    }catch(e){ S.fotos={}; }
    renderResults($("q").value);
    if(!silencioso) toast(`Portafolio actualizado: ${S.rows.length} productos.`);
  }catch(err){
    S.listo=false;
    const bloqueado = /Failed to fetch|NetworkError|CORS/i.test(err.message);
    hint.textContent = "sin conexión";
    $("res").innerHTML = `<div class="status err"><span class="dot"></span><span>${
      bloqueado
        ? "Este visor bloquea la conexión al portafolio. En la versión publicada en GitHub Pages funciona normal."
        : esc(err.message)}</span></div>`;
  }
}
function rec(row){
  const g = k => S.idx[k]!==undefined ? String(row[S.idx[k]]??"").trim() : "";
  const sku = g("sku");
  const dcto = Math.round(nnum(g("dcto").replace("%","")));
  const lista = nnum(g("lista")), oferta = nnum(g("oferta"));
  const conDcto = dcto>0 && lista>0 && oferta>0 && oferta<lista;
  return {
    sku, nombre: bonito(g("nombre")), estado: g("estado"),
    precioLista: lista, precioOferta: oferta || lista,
    dcto: conDcto ? dcto : 0, conDcto,
    cuota: "", // el portafolio aún no trae la cuota de CrediJamar
    tipo: /inactiv/i.test(g("estado")) ? "liquidacion" : "linea",
    foto: S.fotos[sku] || ""
  };
}

    <div class="t fit1" data-max="${12*K}" style="left:${M(8.2)};top:${M(44.3)};width:${M(69)};height:${M(11)};font-size:${P(12)};font-weight:700;color:#fff">${esc(r.nombre)}</div>
    ${p?`<div class="bg" style="left:${M(8.5)};top:${M(62.5)};width:${M(68.5)};height:${M(5.4)};background:#fff"></div>
    <div class="t" style="left:${M(11.9)};top:${M(63.9)};font-size:${P(8.5)};color:#000">PRECIO REGULAR</div>
    <div class="t" style="left:${M(40)};top:${M(63.9)};width:${M(35.3)};text-align:right;font-size:${P(8.5)};color:#000">${reg}</div>`:""}
    <div class="t" style="left:0;top:${M(81.7)};width:${M(85)};text-align:center;font-size:${P(31)};font-weight:700;color:#fff">${of}</div>
    ${p?`<div class="t" style="left:${M(7.5)};top:${M(101.1)};font-size:${P(7.8)};color:#fff">Ll\u00e9vatelo con el</div>
        <div class="t" style="left:${M(7.6)};top:${M(105.5)};font-size:${P(24.8)};font-weight:700;color:#fff">${p}</div>
        <div class="t" style="left:${M(p>=10?18.6:12.6)};top:${M(108.6)};font-size:${P(12.4)};font-weight:700;color:#fff">%dto.</div>`:""}
    <div class="t" style="left:${M(60)};top:${M(110.9)};width:${M(19.9)};text-align:right;font-size:${P(4.1)};font-weight:500;color:#fff">${f}</div>
  </div></div>`;
}
const TPL = { linea:tplLinea, liquidacion:tplLiquidacion };

/* ajusta el nombre para que nunca desborde su caja */
function fitText(root){
  // nombres: se intenta una sola línea; si no alcanza, se reparte en dos y se reduce
  for(const el of root.querySelectorAll(".fit1")){
    const max=parseFloat(el.dataset.max); let fs=max, guard=0;
    el.classList.remove("multi"); el.style.fontSize=fs.toFixed(2)+"pt";
    while(el.scrollWidth > el.clientWidth+1 && fs > max*0.82 && guard++ < 14){
      fs*=0.97; el.style.fontSize=fs.toFixed(2)+"pt";
    }
    if(el.scrollWidth > el.clientWidth+1){
      el.classList.add("multi"); fs=max; el.style.fontSize=fs.toFixed(2)+"pt"; guard=0;
      while((el.scrollHeight > el.clientHeight+1 || el.scrollWidth > el.clientWidth+1) && guard++ < 18){
        fs*=0.95; el.style.fontSize=fs.toFixed(2)+"pt";
      }
    }
  }
  // textos de ancho fijo: se reducen hasta caber
  for(const el of root.querySelectorAll(".fitw")){
    let fs=parseFloat(getComputedStyle(el).fontSize), guard=0;
    while(el.scrollWidth > el.clientWidth+1 && guard++ < 14){ fs*=0.96; el.style.fontSize=fs.toFixed(2)+"px"; }
  }
}

/* ===================== render ===================== */
const PAGE=[215.9,279.4], LW=85, LH=125, COLS=2, ROWS=2;
const ML=(PAGE[0]-COLS*LW)/2, MT=(PAGE[1]-ROWS*LH)/2;
function expand(){ const out=[];
  for(const q of S.queue){ const n=Math.max(1,Math.min(200,q.qty|0||1)); for(let i=0;i<n;i++) out.push(q); }
  return out; }
function render(){
  const items=expand(), per=COLS*ROWS;
  const start=Math.max(0,Math.min(per-1,(S.startAt|0)-1));
  const sheets=Math.max(1,Math.ceil((items.length+start)/per));
  $("mLab").textContent=items.length; $("mSheets").textContent=items.length?sheets:0;
  $("qHint").textContent = S.queue.length ? `${S.queue.length} productos · ${items.length} etiquetas` : "0";
  const z=S.zoom/100, c=$("canvas");
  if(!items.length){
    c.innerHTML=`<div class="empty"><h2>La cola está vacía</h2>
      Conecta el portafolio en el paso 01, busca un producto por SKU y agrégalo. Cada hoja carta lleva 4 etiquetas de 85 × 125 mm.</div>`;
    return;
  }
  let html="";
  for(let s=0;s<sheets;s++){
    html+=`<div class="sheetwrap" style="width:${(PAGE[0]*z).toFixed(2)}mm;height:${(PAGE[1]*z).toFixed(2)}mm">
      <div class="sheetlabel">Hoja ${s+1} de ${sheets}</div>
      <div class="sheet" style="width:${PAGE[0]}mm;height:${PAGE[1]}mm;transform:scale(${z})">`;
    for(let i=0;i<per;i++){
      const idx=s*per+i-start, q=(idx>=0&&idx<items.length)?items[idx]:null;
      const col=i%COLS, row=Math.floor(i/COLS);
      const x=ML+S.ox+col*LW, y=MT+S.oy+row*LH;
      html+=`<div class="slot${S.outline?" outline":""}" style="left:${x.toFixed(2)}mm;top:${y.toFixed(2)}mm;width:${LW}mm;height:${LH}mm">
        ${q?(TPL[q.tipo]||tplLinea)(q):""}</div>`;
    }
    html+=`</div></div>`;
  }
  c.innerHTML=html;
  fitText(c);
}

/* ===================== UI ===================== */
function search(term){
  if(!S.listo||!S.rows.length) return [];
  const t=NORM(term); if(t.length<2) return [];
  const out=[];
  for(const row of S.rows){
    const r=rec(row);
    if(!r.sku && !r.nombre) continue;
    if(NORM(r.sku).startsWith(t)||NORM(r.sku)===t||NORM(r.nombre).includes(t)){ out.push(r); if(out.length>=40) break; }
  }
  return out;
}
function renderResults(term){
  const box=$("res");
  if(!S.listo) return;
  const hits=search(term||"");
  if(!term||term.length<2){ box.innerHTML=`<div class="note">Escribe al menos 2 caracteres.</div>`; return; }
  if(!hits.length){ box.innerHTML=`<div class="note">Sin resultados para «${esc(term)}».</div>`; return; }
  box.innerHTML=hits.map((r,i)=>`<button class="rescard" data-i="${i}">
    ${r.foto?`<img src="${esc(r.foto)}" alt="" onerror="this.style.visibility='hidden'">`:`<img alt="">`}
    <span class="rc"><b>${esc(r.nombre||"(sin nombre)")}</b>
    <small>${esc(r.sku)} · ${money(r.precioOferta)||"sin precio"}${r.conDcto?` · -${r.dcto}%`:""} · ${esc(r.estado||"")}</small></span>
  </button>`).join("");
  box.querySelectorAll(".rescard").forEach(b=>b.addEventListener("click",()=>{
    addToQueue(hits[+b.dataset.i]); }));
}
function addToQueue(r, qty){
  const ex=S.queue.find(q=>q.sku===r.sku);
  if(ex){ ex.qty+= (qty||1); } else { S.queue.push({...r, qty:qty||1}); }
  save(); renderQueue(); render();
  toast(`${r.nombre||r.sku} agregado a la cola.`);
}
function renderQueue(){
  const q=$("queue");
  if(!S.queue.length){ q.innerHTML=`<div class="note">Aún no hay productos en la cola.</div>`; return; }
  q.innerHTML=S.queue.map((it,i)=>`<div class="qrow">
    <span><b>${esc(it.nombre||it.sku)}</b><small>${esc(it.sku)}</small></span>
    <select data-i="${i}" data-k="tipo">
      <option value="linea"${it.tipo==="linea"?" selected":""}>Línea</option>
      <option value="liquidacion"${it.tipo==="liquidacion"?" selected":""}>Liquidación</option>
    </select>
    <input type="number" min="1" max="200" value="${it.qty}" data-i="${i}" data-k="qty">
    <button class="iconbtn" data-del="${i}" title="Quitar">×</button>
  </div>`).join("");
  q.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("change",e=>{
    const i=+e.target.dataset.i, k=e.target.dataset.k;
    S.queue[i][k] = k==="qty" ? Math.max(1,Math.min(200,+e.target.value||1)) : e.target.value;
    save(); renderQueue(); render();
  }));
  q.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click",()=>{
    S.queue.splice(+b.dataset.del,1); save(); renderQueue(); render(); }));
}

/* ===================== arranque ===================== */
load();
$("startAt").value=S.startAt; $("outline") && ($("outline").checked=S.outline);
$("zoom").value=S.zoom; $("zv").textContent=S.zoom+"%";
renderQueue(); render();
cargarPortafolio(true);

let qt; $("q").addEventListener("input",e=>{ clearTimeout(qt); const v=e.target.value; qt=setTimeout(()=>renderResults(v),160); });
$("btnReload").addEventListener("click",()=>cargarPortafolio(false));
$("btnBulk").addEventListener("click",()=>{
  if(!S.listo){ toast("El portafolio todavía no está cargado."); return; }
  const lines=$("bulk").value.split("\n").map(l=>l.trim()).filter(Boolean);
  let ok=0; const miss=[];
  for(const line of lines){
    const [sk,c]=line.split(/[,;\t]/).map(s=>(s||"").trim());
    const row=S.rows.find(r=>String(r[S.idx.sku]??"").trim()===sk);
    if(row){ addToQueueSilent(rec(row), Math.max(1,parseInt(c||"1",10)||1)); ok++; } else miss.push(sk);
  }
  save(); renderQueue(); render();
  toast(miss.length ? `${ok} agregados. Sin coincidencia: ${miss.slice(0,6).join(", ")}${miss.length>6?"…":""}` : `${ok} productos agregados.`);
});
$("btnClear").addEventListener("click",()=>{ S.queue=[]; save(); renderQueue(); render(); });
$("startAt").addEventListener("input",e=>{ const v=parseInt(e.target.value,10);
  if(isFinite(v)){ S.startAt=Math.min(4,Math.max(1,v)); save(); render(); } });
$("zoom").addEventListener("input",e=>{S.zoom=+e.target.value;$("zv").textContent=S.zoom+"%";save();render();});
$("btnPrint").addEventListener("click",()=>{ if(!expand().length){toast("No hay etiquetas en la cola.");return;} window.print(); });
$("btnTheme").addEventListener("click",()=>{ const c=document.documentElement.getAttribute("data-theme");
  const n=c==="dark"?"light":c==="light"?"":"dark";
  if(n) document.documentElement.setAttribute("data-theme",n); else document.documentElement.removeAttribute("data-theme"); });
window.addEventListener("beforeprint",()=>{ document.querySelectorAll(".sheet").forEach(s=>s.style.transform="none");
  document.querySelectorAll(".sheetwrap").forEach(w=>{w.style.width=PAGE[0]+"mm";w.style.height=PAGE[1]+"mm";}); });
window.addEventListener("afterprint",render);
</script>
